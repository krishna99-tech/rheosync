# ==============================================================================
# WALVOIL — IoT VISCOSITY MEASUREMENT & REPORTING SYSTEM
# Production Docker Compose Configuration
# ==============================================================================

services:
  walvoil-viscosity:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: walvoil_viscosity_app
    restart: unless-stopped
    ports:
      - "5001:5001/tcp"       # Web Dashboard & Diagnostic REST API
      - "5002:5002/udp"     # IoT Station Telemetry Receiver
    volumes:
      # 1. Reports Archive: Persists all generated Excel and PDF reports permanently on host
      - ./Reports:/app/Reports
      # 2. SQLite Database: Persists test audit trail and telemetry history permanently on host
      - ./device_data.db:/app/device_data.db
      # 3. Application Logs: Exposes rotating industrial log files (app.log) directly on host
      - ./logs:/app/logs
    environment:
      - TZ=Asia/Kolkata
      - FLASK_DEBUG=0
      - PORT=5001
      - UDP_PORT=5002
      - OFFLINE_TIMEOUT=30
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
